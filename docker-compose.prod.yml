# Прод-стек для пайплайна самодеплою (COMPOSE_FILE=docker-compose.prod.yml).
# Самодостатній: міграції — автоматично при старті api (CREATE TABLE IF NOT
# EXISTS з retry), self-signed cert для 443 генерує entrypoint nginx.
# Секрети — з .env на сервері (див. web-app/.env.example).

x-logging: &default-logging
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

services:
  # nginx: статика SPA + TLS (Cloudflare Full) + proxy /api → api
  web:
    build: ./web-app
    image: slabcutplanner-web
    pull_policy: build
    container_name: slabcutplanner_web
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:-slabcutplanner.viyar.tech}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - tls-certs:/etc/nginx/certs
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

  # Бекенд: Keycloak OIDC + CRUD проектів у Postgres
  api:
    build: ./web-app/server
    image: slabcutplanner-api
    pull_policy: build
    container_name: slabcutplanner_api
    environment:
      DATABASE_URL: postgres://slabcut:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/slabcut
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-qr}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET in .env}
      KEYCLOAK_DISCOVERY_URL: ${KEYCLOAK_DISCOVERY_URL:-https://auth-dev.viyar.tech/auth/realms/ViyarLocal/.well-known/openid-configuration}
      REDIRECT_URI: ${REDIRECT_URI:-https://slabcutplanner.viyar.tech/api/auth/callback}
      APP_URL: ${APP_URL:-https://slabcutplanner.viyar.tech/}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    container_name: slabcutplanner_postgres
    environment:
      POSTGRES_USER: slabcut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: slabcut
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging

  # Централізовані логи: promtail → Loki → Grafana (фільтр host=slabcutplanner)
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  tls-certs:
